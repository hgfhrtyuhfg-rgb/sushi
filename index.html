<!DOCTYPE html>
<html>
<head>
<style>
body {
    background-color: #1a1a1a; 
    color: #ffffff;
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    line-height: 1.6;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    text-align: center; 
}

img {
    max-width: 100%;
    height: auto;
    border-radius: 15px;
    display: block;
    margin: 30px auto; 
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.2); 
}

ul {
    list-style: none;
    padding: 0;
}

ul li {
    border: 1px solid #ff4757; 
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    background-color: #2b2b2b; 
    font-size: 18px;
}

.header {
    background-color: #ff4757; 
    padding: 30px 20px;
    text-align: center;
    border-bottom: 4px solid #ffa502; 
}

.header h2 {
    margin: 0;
    font-size: 32px;
    color: #ffffff;
}

.header p {
    color: #ffeaa7;
    margin-top: 10px;
}

button {
    color: #ffffff;
    background-color: #ff4757; 
    border-radius: 10px;
    width: 100%; 
    max-width: 300px;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    display: block;
    margin: 20px auto;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s; 
}

button:hover {
    background-color: #ffa502; 
    color: #1a1a1a;
}

#result {
    font-size: 20px;
    font-weight: bold;
    color: #ffa502 !important; 
    margin-top: 20px;
}


@media (max-width: 600px) {
    body {
        margin: 0;
    }
    .header h2 {
        font-size: 24px; 
    }
    ul li {
        font-size: 16px;
    }
}








</style>
